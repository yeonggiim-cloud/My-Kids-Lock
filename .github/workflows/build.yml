name: Build Android APK
on: [workflow_dispatch] # 수동 실행 트리거 제공

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # 깃허브 캐시 서버가 먹통일 때 빌드가 실패하는 것을 완벽 방지하기 위해 캐시 기능 차단
      - name: Setup Gradle without Caching
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/example/studyblocker
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          
          # 1. settings.gradle.kts 생성
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "StudyBlocker"
          include(":app")
          EOF
          
          # 2. build.gradle.kts (루트) 생성
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF
          
          # 3. app/build.gradle.kts 생성
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.studyblocker"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.studyblocker"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
          }
          EOF
          
          # 4. AndroidManifest.xml 생성
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.studyblocker">
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application 
                  android:allowBackup="false" 
                  android:label="FocusLock" 
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".MyDeviceAdminReceiver" android:permission="android.permission.BIND_DEVICE_ADMIN" android:exported="true">
                      <meta-data android:name="android.app.device_admin" android:resource="@xml/device_admin_policies" />
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                          <action android:name="android.app.action.PROFILE_PROVISIONING_COMPLETE" />
                      </intent-filter>
                  </receiver>
                  <service android:name=".FlashlightMonitorService" android:foregroundServiceType="specialUse" android:exported="false" />
              </application>
          </manifest>
          EOF

          # 5. device_admin_policies.xml 생성
          echo '<?xml version="1.0" encoding="utf-8"?><device-admin xmlns:android="http://schemas.android.com/apk/res/android"><uses-policies><disable-keyguard-features /><force-lock /></uses-policies></device-admin>' > app/src/main/res/xml/device_admin_policies.xml
          
          # 6. activity_main.xml 생성
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:padding="24dp" android:gravity="center">
              <TextView android:id="@+id/tvStatus" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="로딩 중..." android:textSize="16sp" android:gravity="center" android:layout_marginBottom="24dp" />
              <EditText android:id="@+id/etPassword" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="비밀번호 입력" android:inputType="textPassword" android:layout_marginBottom="16dp" />
              <Button android:id="@+id/btnAction" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="확인" />
          </LinearLayout>
          EOF

          # 7. MyDeviceAdminReceiver.kt 생성 (중복 import 오타 수정 완료!)
          cat << 'EOF' > app/src/main/java/com/example/studyblocker/MyDeviceAdminReceiver.kt
          package com.example.studyblocker
          import android.app.admin.DeviceAdminReceiver
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.widget.Toast
          class MyDeviceAdminReceiver : DeviceAdminReceiver() {
              companion object {
                  fun getComponentName(context: Context): ComponentName {
                      return ComponentName(context.applicationContext, MyDeviceAdminReceiver::class.java)
                  }
              }
              override fun onEnabled(context: Context, intent: Intent) {
                  super.onEnabled(context, intent)
                  Toast.makeText(context, "디바이스 소유자 권한이 활성화되었습니다.", Toast.LENGTH_SHORT).show()
              }
          }
          EOF

          # 8. LockManager.kt 생성
          cat << 'EOF' > app/src/main/java/com/example/studyblocker/LockManager.kt
          package com.example.studyblocker
          import android.app.admin.DevicePolicyManager
          import android.content.Context
          import android.content.Intent
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.UserManager
          object LockManager {
              fun lockDevice(context: Context) {
                  val dpm = context.getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                  val admin = MyDeviceAdminReceiver.getComponentName(context)
                  if (dpm.isDeviceOwnerApp(context.packageName)) {
                      dpm.setUninstallBlocked(admin, context.packageName, true)
                      dpm.addUserRestriction(admin, UserManager.DISALLOW_CONFIG_WIFI)
                      dpm.addUserRestriction(admin, UserManager.DISALLOW_CONFIG_MOBILE_NETWORKS)
                      dpm.addUserRestriction(admin, UserManager.DISALLOW_NETWORK_RESET)
                      dpm.addUserRestriction(admin, UserManager.DISALLOW_CONFIG_TETHERING)
                  }
                  val wifiManager = context.applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                  @Suppress("DEPRECATION")
                  wifiManager.isWifiEnabled = false
                  val serviceIntent = Intent(context, FlashlightMonitorService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      context.startForegroundService(serviceIntent)
                  } else {
                      context.startService(serviceIntent)
                  }
                  setLockStatus(context, true)
              }
              fun unlockDevice(context: Context) {
                  val dpm = context.getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                  val admin = MyDeviceAdminReceiver.getComponentName(context)
                  if (dpm.isDeviceOwnerApp(context.packageName)) {
                      dpm.setUninstallBlocked(admin, context.packageName, false)
                      dpm.clearUserRestriction(admin, UserManager.DISALLOW_CONFIG_WIFI)
                      dpm.clearUserRestriction(admin, UserManager.DISALLOW_CONFIG_MOBILE_NETWORKS)
                      dpm.clearUserRestriction(admin, UserManager.DISALLOW_NETWORK_RESET)
                      dpm.clearUserRestriction(admin, UserManager.DISALLOW_CONFIG_TETHERING)
                  }
                  context.stopService(Intent(context, FlashlightMonitorService::class.java))
                  setLockStatus(context, false)
              }
              private fun setLockStatus(context: Context, locked: Boolean) {
                  val prefs = context.getSharedPreferences("blocker_prefs", Context.MODE_PRIVATE)
                  prefs.edit().putBoolean("is_locked", locked).apply()
              }
              fun isLocked(context: Context): Boolean {
                  val prefs = context.getSharedPreferences("blocker_prefs", Context.MODE_PRIVATE)
                  return prefs.getBoolean("is_locked", false)
              }
          }
          EOF

          # 9. FlashlightMonitorService.kt 생성
          cat << 'EOF' > app/src/main/java/com/example/studyblocker/FlashlightMonitorService.kt
          package com.example.studyblocker
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.hardware.camera2.CameraManager
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.widget.Toast
          class FlashlightMonitorService : Service() {
              private lateinit var cameraManager: CameraManager
              private val handler = Handler(Looper.getMainLooper())
              private var isTorchOn = false
              private val REQUIRED_DURATION_MS = 10 * 60 * 1000L
              private val unlockRunnable = Runnable {
                  if (isTorchOn) {
                      LockManager.unlockDevice(applicationContext)
                      Toast.makeText(applicationContext, "⚡ 히든 모드: 10분 플래시 감지로 잠금이 해제되었습니다.", Toast.LENGTH_LONG).show()
                      stopSelf()
                  }
              }
              private val torchCallback = object : CameraManager.TorchCallback() {
                  override fun onTorchModeChanged(cameraId: String, enabled: Boolean) {
                      super.onTorchModeChanged(cameraId, enabled)
                      isTorchOn = enabled
                      if (enabled) {
                          handler.postDelayed(unlockRunnable, REQUIRED_DURATION_MS)
                      } else {
                          handler.removeCallbacks(unlockRunnable)
                      }
                  }
              }
              override fun onCreate() {
                  super.onCreate()
                  startForegroundNotification()
                  cameraManager = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                  cameraManager.registerTorchCallback(torchCallback, handler)
              }
              private fun startForegroundNotification() {
                  val channelId = "FlashMonitorChannel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "보안 모니터링", NotificationManager.IMPORTANCE_LOW)
                      val manager = getSystemService(NotificationManager::class.java)
                      manager.createNotificationChannel(channel)
                  }
                  val notification: Notification = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, channelId)
                          .setContentTitle("보안 정책 활성화 중")
                          .setContentText("네트워크가 차단되었습니다.")
                          .setSmallIcon(android.R.drawable.ic_lock_lock)
                          .build()
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(this)
                          .setContentTitle("보안 정책 활성화 중")
                          .setContentText("네트워크가 차단되었습니다.")
                          .setSmallIcon(android.R.drawable.ic_lock_lock)
                          .build()
                  }
                  startForeground(1001, notification)
              }
              override fun onDestroy() {
                  super.onDestroy()
                  cameraManager.unregisterTorchCallback(torchCallback)
                  handler.removeCallbacks(unlockRunnable)
              }
              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          # 10. MainActivity.kt 생성
          cat << 'EOF' > app/src/main/java/com/example/studyblocker/MainActivity.kt
          package com.example.studyblocker
          import android.app.admin.DevicePolicyManager
          import android.content.Context
          import android.os.Bundle
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import java.security.MessageDigest
          class MainActivity : AppCompatActivity() {
              private lateinit var etPassword: EditText
              private lateinit var btnAction: Button
              private lateinit var tvStatus: TextView
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  etPassword = findViewById(R.id.etPassword)
                  btnAction = findViewById(R.id.btnAction)
                  tvStatus = findViewById(R.id.tvStatus)
                  updateUiState()
                  btnAction.setOnClickListener { handleAction() }
              }
              override fun onResume() {
                  super.onResume()
                  updateUiState()
              }
              private fun updateUiState() {
                  val dpm = getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                  if (!dpm.isDeviceOwnerApp(packageName)) {
                      tvStatus.text = "⚠️ 경고: Device Owner 권한이 부여되지 않았습니다.\nADB 명령어로 권한을 먼저 설정해야 완벽히 작동합니다."
                      btnAction.isEnabled = false
                      return
                  }
                  val hasPassword = getSavedPasswordHash() != null
                  val isLocked = LockManager.isLocked(this)
                  if (!hasPassword) {
                      tvStatus.text = "보호용 비밀번호를 설정하세요."
                      btnAction.text = "비밀번호 설정 및 잠금 시작"
                      btnAction.isEnabled = true
                  } else if (isLocked) {
                      tvStatus.text = "현재 데이터 및 와이파이가 잠겨 있습니다.\n비밀번호를 입력하거나 히든 기능을 사용하세요."
                      btnAction.text = "잠금 해제"
                      btnAction.isEnabled = true
                  } else {
                      tvStatus.text = "현재 잠금이 해제된 상태입니다."
                      btnAction.text = "다시 잠금 시작"
                      btnAction.isEnabled = true
                  }
              }
              private fun handleAction() {
                  val input = etPassword.text.toString().trim()
                  if (input.isEmpty()) {
                      Toast.makeText(this, "비밀번호를 입력하세요.", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val savedHash = getSavedPasswordHash()
                  if (savedHash == null) {
                      savePasswordHash(hashPassword(input))
                      LockManager.lockDevice(this)
                      Toast.makeText(this, "비밀번호가 설정되었으며 네트워크가 차단되었습니다.", Toast.LENGTH_LONG).show()
                      etPassword.text.clear()
                      updateUiState()
                  } else {
                      if (hashPassword(input) == savedHash) {
                          if (LockManager.isLocked(this)) {
                              LockManager.unlockDevice(this)
                              Toast.makeText(this, "비밀번호 인증 성공: 모든 제한이 해제되었습니다.", Toast.LENGTH_SHORT).show()
                          } else {
                              LockManager.lockDevice(this)
                              Toast.makeText(this, "네트워크가 다시 차단되었습니다.", Toast.LENGTH_SHORT).show()
                          }
                          etPassword.text.clear()
                          updateUiState()
                      } else {
                          Toast.makeText(this, "비밀번호가 일치하지 않습니다.", Toast.LENGTH_SHORT).show()
                      }
                  }
              }
              private fun hashPassword(password: String): String {
                  val bytes = MessageDigest.getInstance("SHA-256").digest(password.toByteArray())
                  return bytes.joinToString("") { "%02x".format(it) }
              }
              private fun savePasswordHash(hash: String) {
                  getSharedPreferences("blocker_prefs", Context.MODE_PRIVATE).edit().putString("pw_hash", hash).apply()
              }
              private fun getSavedPasswordHash(): String? {
                  return getSharedPreferences("blocker_prefs", Context.MODE_PRIVATE).getString("pw_hash", null)
              }
          }
          EOF

      - name: Build and Initialize Gradle Wrapper
        run: |
          npm install -g gradle
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyBlocker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
